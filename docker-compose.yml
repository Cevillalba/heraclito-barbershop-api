version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: barbershop_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: barbershop_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: barbershop_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  mysql_data: